<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RG ROBOTICS - Leading High-Tech Company</title>
    <meta name="description" content="RG ROBOTICS는 인간의 능력을 확장하는 웨어러블 로봇 전문 기업입니다.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="#home" class="logo">
            <img src="logo_rg.png" alt="RG ROBOTICS" class="logo-img">
            <span>RG ROBOTICS</span>
        </a>

        <!-- Mobile Menu Toggle -->
        <button class="mobile-menu-btn">☰</button>

        <nav id="main-nav">
            <ul>
                <li><a href="#home">홈</a></li>
                <li><a href="#products">제품</a></li>
                <li><a href="#news">뉴스 센터</a></li>
                <li><a href="#qna">고객지원</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <div class="lang-switcher">
                <span class="lang-btn active">KR</span>
                <span style="color: #ddd;">|</span>
                <span class="lang-btn">EN</span>
            </div>
            <a href="#qna/write" class="btn btn-primary" style="padding: 10px 20px; font-size: 0.85rem;">문의하기</a>
        </div>
    </header>

    <main id="app-root">
        <!-- Content will be injected here by app.js -->
    </main>

    <footer>
        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 40px;">
            <div>
                <h3 style="margin-bottom: 20px;">RG ROBOTICS</h3>
                <p style="color: #888; max-width: 300px;">인간의 한계를 넘어서는 기술로<br>세상을 더 따뜻하게 만듭니다.</p>
            </div>
            <div>
                <h4 style="margin-bottom: 20px;">Company</h4>
                <ul style="color: #888;">
                    <li>About Us</li>
                    <li>Careers</li>
                    <li>Contact</li>
                </ul>
            </div>
            <div>
                <h4 style="margin-bottom: 20px;">Support</h4>
                <ul style="color: #888;">
                    <li>FAQ</li>
                    <li>Q&A</li>
                    <li>Service Center</li>
                </ul>
            </div>
        </div>
        <div
            style="margin-top: 60px; padding-top: 30px; border-top: 1px solid #333; color: #555; font-size: 0.85rem; text-align: center;">
            &copy; 2026 RG ROBOTICS. All rights reserved.
        </div>
    </footer>

    <!-- Load Data and Scripts -->
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6K0L3dwqfdx0gVRgkPABvgmNh84u8V_E",
            authDomain: "mycompany-8304c.firebaseapp.com",
            projectId: "mycompany-8304c",
            storageBucket: "mycompany-8304c.firebasestorage.app",
            messagingSenderId: "981278556691",
            appId: "1:981278556691:web:8e748982ee48d2245575e6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.firebaseDB = { collection, addDoc, getDocs, query, orderBy, doc, deleteDoc, updateDoc }; 
    </script>

    <!-- Chatbot Widget -->
    <div id="chatbot-widget">
        <button id="chatbot-toggle" title="Chat with AI">
            <span class="chat-icon">💬</span>
        </button>
        <div id="chat-window" class="hidden">
            <div class="chat-header">
                <h3>RG AI Assistant</h3>
                <button id="chat-close">✕</button>
            </div>
            <div id="chat-messages">
                <div class="message bot">안녕하세요! RG ROBOTICS AI 비서입니다. 무엇을 도와드릴까요?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="메시지를 입력하세요...">
                <button id="chat-send">전송</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
